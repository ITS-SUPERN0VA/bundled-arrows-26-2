plugins {
	id 'fabric-loom' version '1.17-SNAPSHOT'
	id 'maven-publish'
}

java {
	toolchain {
		// Minecraft 26.2 runs on Java 25.
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()

	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}

	maven {
		name = "Mojang"
		url = "https://libraries.minecraft.net/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// 26.x ships UNOBFUSCATED - there are no client/server mapping files
	// for Mojang to publish, so loom.officialMojangMappings() fails here.
	// Use an identity mapping instead: the names in the jar already ARE
	// the real (Mojang) names, so there's nothing to remap.
	mappings "net.fabricmc:intermediary:0.0.0:v2"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
